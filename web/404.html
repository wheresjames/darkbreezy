<body class="notfound">
<main class="nf-page">
  <a class="nf-home" href="/#/"><img src="/assets/favicon.svg" alt="" width="40" height="40"><span>Dark Breezy</span></a>
  <h1>Page not found</h1>
  <p>There's nothing at <code id="nf-path">this address</code>.</p>
  <p class="muted">Dark Breezy's pages have a <code>#</code> in their address, like <code>darkbreezy.com/#/place/52.52,13.41/Berlin</code>.</p>
  <p><a class="btn btn-primary" href="/#/">Open the dashboard</a> <a class="btn" href="/#/search">Find a place</a></p>
</main>
