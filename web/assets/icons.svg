<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!-- Dark Breezy's icons, used as <svg><use href="assets/icons.svg#name"></svg>
     (core/h.js icon()). Interface icons (24 px) draw in currentColor;
     weather icons (64 px, util/wmo-codes.js) have their own colors, chosen
     to read on both light and dark cards. -->
<defs>
  <path id="cloud-shape" d="M20 50H46A11 11 0 0 0 47.5 28.1A15 15 0 0 0 19.3 30.2A10 10 0 0 0 20 50Z"/>
  <g id="sun-shape">
    <g stroke="#f4a62a" stroke-width="3.5" stroke-linecap="round">
      <path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/>
    </g>
    <circle cx="32" cy="32" r="12" fill="#f7c443" stroke="#f4a62a" stroke-width="2"/>
  </g>
  <path id="moon-shape" d="M38 10a22 22 0 1 0 16 33A18 18 0 0 1 38 10Z" fill="#eadfb4" stroke="#c9b97a" stroke-width="2" stroke-linejoin="round"/>
  <use id="cloud-light" href="#cloud-shape" fill="#eef2f7" stroke="#8fa1b6" stroke-width="2.5" stroke-linejoin="round"/>
  <use id="cloud-grey" href="#cloud-shape" fill="#c3ccd8" stroke="#73859b" stroke-width="2.5" stroke-linejoin="round"/>
  <use id="cloud-dark" href="#cloud-shape" fill="#8796aa" stroke="#56677d" stroke-width="2.5" stroke-linejoin="round"/>
</defs>

<!-- Weather -->
<symbol id="clear-day" viewBox="0 0 64 64"><use href="#sun-shape"/></symbol>
<symbol id="clear-night" viewBox="0 0 64 64"><use href="#moon-shape"/></symbol>
<symbol id="partly-day" viewBox="0 0 64 64">
  <use href="#sun-shape" transform="translate(4 2) scale(.62)"/>
  <use href="#cloud-light" transform="translate(4 4)"/>
</symbol>
<symbol id="partly-night" viewBox="0 0 64 64">
  <use href="#moon-shape" transform="translate(6 4) scale(.55)"/>
  <use href="#cloud-light" transform="translate(4 4)"/>
</symbol>
<symbol id="cloudy" viewBox="0 0 64 64">
  <use href="#cloud-grey" transform="translate(10 -6) scale(.8)"/>
  <use href="#cloud-light" transform="translate(-2 4)"/>
</symbol>
<symbol id="fog" viewBox="0 0 64 64">
  <use href="#cloud-grey" transform="translate(0 -10)"/>
  <g stroke="#8fa1b6" stroke-width="3.5" stroke-linecap="round"><path d="M12 47h30M20 54h32M10 61h26"/></g>
</symbol>
<symbol id="drizzle" viewBox="0 0 64 64">
  <use href="#cloud-light" transform="translate(0 -10)"/>
  <g fill="#3d8fe0"><circle cx="22" cy="49" r="2.4"/><circle cx="34" cy="53" r="2.4"/><circle cx="46" cy="49" r="2.4"/><circle cx="28" cy="59" r="2.4"/><circle cx="40" cy="60" r="2.4"/></g>
</symbol>
<symbol id="rain" viewBox="0 0 64 64">
  <use href="#cloud-grey" transform="translate(0 -10)"/>
  <g stroke="#3d8fe0" stroke-width="3.5" stroke-linecap="round"><path d="M22 46l-3 9M34 46l-3 11M46 46l-3 9"/></g>
</symbol>
<symbol id="heavy-rain" viewBox="0 0 64 64">
  <use href="#cloud-dark" transform="translate(0 -10)"/>
  <g stroke="#2f7fd6" stroke-width="3.5" stroke-linecap="round"><path d="M17 45l-4 12M27 45l-4 15M37 45l-4 13M47 45l-4 15"/></g>
</symbol>
<symbol id="showers-day" viewBox="0 0 64 64">
  <use href="#sun-shape" transform="translate(4 0) scale(.55)"/>
  <use href="#cloud-light" transform="translate(4 -6)"/>
  <g stroke="#3d8fe0" stroke-width="3.5" stroke-linecap="round"><path d="M28 50l-3 8M40 50l-3 9"/></g>
</symbol>
<symbol id="showers-night" viewBox="0 0 64 64">
  <use href="#moon-shape" transform="translate(6 2) scale(.5)"/>
  <use href="#cloud-light" transform="translate(4 -6)"/>
  <g stroke="#3d8fe0" stroke-width="3.5" stroke-linecap="round"><path d="M28 50l-3 8M40 50l-3 9"/></g>
</symbol>
<symbol id="sleet" viewBox="0 0 64 64">
  <use href="#cloud-grey" transform="translate(0 -10)"/>
  <g stroke="#3d8fe0" stroke-width="3.5" stroke-linecap="round"><path d="M22 46l-3 9M44 46l-3 9"/></g>
  <g stroke="#7fa6cf" stroke-width="2.5" stroke-linecap="round"><path d="M32 50v10M27.7 52.5l8.6 5M27.7 57.5l8.6-5"/></g>
</symbol>
<symbol id="snow" viewBox="0 0 64 64">
  <use href="#cloud-light" transform="translate(0 -10)"/>
  <g stroke="#7fa6cf" stroke-width="2.5" stroke-linecap="round">
    <path d="M22 46v10M17.7 48.5l8.6 5M17.7 53.5l8.6-5"/>
    <path d="M42 46v10M37.7 48.5l8.6 5M37.7 53.5l8.6-5"/>
    <path d="M32 53v10M27.7 55.5l8.6 5M27.7 60.5l8.6-5"/>
  </g>
</symbol>
<symbol id="thunder" viewBox="0 0 64 64">
  <use href="#cloud-dark" transform="translate(0 -10)"/>
  <path d="M34 40l-9 12h7l-4 11 12-15h-7l4-8z" fill="#f7c443" stroke="#e09b1a" stroke-width="1.5" stroke-linejoin="round"/>
</symbol>

<!-- Interface -->
<symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></symbol>
<symbol id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
<symbol id="star-fill" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
<symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="locate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
<symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
<symbol id="warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L2 20h20z"/><path d="M12 9v5M12 17h.01"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l6 18-6-4-6 4z"/></symbol>
<symbol id="trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/></symbol>
<symbol id="external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
<symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
<symbol id="fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="fullscreen-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
<symbol id="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
</svg>
